name: cooking_monster
description: "A way to store and share your recipes localy."
publish_to: 'none'
version: 0.1.0+1

flutter_launcher_icons:
  image_path: "assets/app_icon/icon.png"
  ios: true
  android: true
  remove_alpha_ios: true

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.2
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.7.1
  qr_flutter: ^4.1.0
  file_picker: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
